[package]
name = "ruleforge"
version = "0.0.0"
description = "Ruleforge, a rebuild of the VTClassic loot editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ruleforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
